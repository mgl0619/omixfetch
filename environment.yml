# Conda/mamba environment for omixfetch.
#
#   mamba env create -f environment.yml      # or: micromamba / conda
#   mamba activate omixfetch
#   pip install -e ".[dev]"
#
# aria2 is included deliberately: it is the download engine, not an optional
# extra, and installing it through conda-forge avoids depending on a system
# package manager.
#
# geofetch is a required dependency -- it is the default metadata resolver for
# GEO series. It is installed via pip below because the conda-forge build lags
# the PyPI release. It brings the pepkit stack (peppy, pandas, numpy, pipestat,
# yacman) with it, roughly 137 MB.
#
# NOT included, and not needed: the SRA Toolkit (prefetch / fasterq-dump).
# omixfetch fetches raw reads from ENA as plain HTTPS files and never invokes
# geofetch's own raw-data path. If you want that path separately:
#     mamba install -c bioconda sra-tools
name: omixfetch
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.13
  - requests>=2.28
  - rich>=13.0
  - typer>=0.9
  - pyyaml>=6.0
  - pandas>=1.5
  - aria2>=1.36
  # Development tooling; drop these for a runtime-only environment.
  - pytest>=7.0
  - pytest-cov>=4.0
  - ruff>=0.4
  - pip
  - pip:
      - geofetch>=0.12
