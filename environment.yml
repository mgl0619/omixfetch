# Conda/mamba environment for omixfetch.
#
#   mamba env create -f environment.yml      # or: micromamba / conda
#   mamba activate omixfetch
#   pip install -e ".[dev]"
#
# Channel order matters: conda-forge before bioconda.
#
# aria2 is the download engine, not an optional extra.
#
# sra-tools is deliberately NOT here. It and aria2 cannot be solved into one
# environment on osx-arm64 -- they disagree over libxml2/icu, and installing
# sra-tools into this environment REMOVES aria2, silently losing
# multi-connection downloads. Conversion gets its own environment:
#
#     mamba env create -f environment-convert.yml
#
# See TUTORIAL.md section 4 for how the two fit together. Downloading .sra
# archives needs no toolkit at all; only `--convert fastq` does.
name: omixfetch
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.13
  - requests>=2.28
  - rich>=13.0
  - typer>=0.9
  - pyyaml>=6.0
  - pandas>=1.5
  - aria2>=1.36
  # Development tooling; drop these for a runtime-only environment.
  - pytest>=7.0
  - pytest-cov>=4.0
  - ruff>=0.4
  - pip
  - pip:
      - geofetch>=0.12
