[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omixfetch"
version = "0.6.0"
description = "Parallel, resumable downloads of public genomics datasets from NCBI GEO"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["genomics", "GEO", "NCBI", "download", "aria2", "scRNA-seq", "bioinformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "requests>=2.28",
    "typer>=0.9",
    "rich>=13.0",
    "pyyaml>=6.0",
    # Metadata resolution for GEO series. geofetch maintains its own SOFT
    # parsing and is the better-exercised parser, so it is the default
    # resolver; the built-in one remains for GSM/GPL accessions, which
    # geofetch's project API does not handle.
    "geofetch>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4"]

[project.scripts]
omixfetch = "omixfetch.cli:app"

[project.urls]
Homepage = "https://github.com/mgl0619/omixfetch"
Issues = "https://github.com/mgl0619/omixfetch/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/omixfetch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer declares CLI options as call expressions in argument defaults; that is
# the documented idiom for the library, not the mutable-default bug B008 targets.
"src/omixfetch/cli.py" = ["B008"]
